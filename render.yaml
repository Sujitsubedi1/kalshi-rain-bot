services:
  - type: cron
    name: kalshi-rain-bot
    runtime: python
    # 10:30 UTC daily -- Kalshi opens each day's KXRAIN event at ~09:10 UTC
    # the day before, so this leaves a safe buffer rather than risking a
    # "not open yet" no-op if it ran right at the boundary.
    schedule: "30 10 * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python -u rain_bot.py
    envVars:
      - key: KALSHI_ENV
        value: prod
      - key: KALSHI_KEY_ID
        sync: false
      - key: KALSHI_PRIVATE_KEY_PEM
        sync: false
      - key: STAKE_DOLLARS
        value: "1"
      - key: MIN_PRICE
        value: "0.10"
      - key: MAX_PRICE
        value: "0.90"
      - key: DRY_RUN
        value: "false"

  - type: cron
    name: kalshi-rain-alert
    runtime: python
    # 15:30 UTC -- was 08:30 UTC, wrong: assumed settlement follows
    # ~30min after each market's own close_time. Real observed behavior
    # (2026-08-28) is Kalshi settles in batches ~7.5h after each timezone
    # group's close: Eastern ~11:30 UTC, Central ~12:30 UTC, Pacific not
    # until ~14:30 UTC for the same event. 15:30 UTC leaves a safety
    # margin after the slowest (Pacific) group.
    schedule: "30 15 * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python -u rain_alert.py
    envVars:
      - key: KALSHI_ENV
        value: prod
      - key: KALSHI_KEY_ID
        sync: false
      - key: KALSHI_PRIVATE_KEY_PEM
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
